<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy latency · Before / After</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      background: #f3f5f8;
      color: #192b44;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 58rem; margin: auto; padding: 3rem 1.25rem; }
    header {
      padding: 2rem;
      border-radius: 1rem;
      background: #162c49;
      color: white;
    }
    .eyebrow { color: #b9d2ec; font-size: .75rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: .25rem 0 .4rem; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; }
    header p { margin: 0; color: #dde9f7; }
    .panel {
      margin-top: 1.25rem;
      padding: 1.5rem;
      border: 1px solid #dce3ec;
      border-radius: 1rem;
      background: white;
    }
    .toolbar { margin-top: 1.25rem; }
    .source { margin-top: 1.5rem; }
    h2 { margin: 0; font-size: 1.125rem; }
    a { color: #235486; text-underline-offset: .15em; }
    :focus-visible { outline: 3px solid #235486; outline-offset: 3px; }
    p { margin: .5rem 0 1.25rem; }
    .series-key { display: none; }
    .comparison { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-variant-numeric: tabular-nums; }
    th, td { padding: .85rem .65rem; border-bottom: 1px solid #e0e7ef; }
    thead { background: #eaf0f7; }
    thead small { display: block; color: #4d6076; font-weight: 400; overflow-wrap: anywhere; }
    td { white-space: nowrap; }
    .note { color: #4d6076; margin: 1rem 0 0; font-size: .875rem; }
    dl { margin: .75rem 0 0; }
    dt { font-weight: 600; }
    dd { margin: 0 0 .75rem; overflow-wrap: anywhere; }
    dd:last-child { margin-bottom: 0; }
    @media (max-width: 38rem) {
      main { padding: 1rem .75rem; }
      header, .panel { padding: 1rem; }
      .series-key { display: grid; gap: .25rem; margin: 1rem 0; overflow-wrap: anywhere; }
      .comparison { scroll-margin-block-start: .5rem; }
      table, tbody { display: block; }
      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      tbody tr {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border: 1px solid #dce3ec;
        border-radius: .5rem;
        margin-bottom: .75rem;
      }
      tbody tr:last-child { margin-bottom: 0; }
      tbody th, tbody td { padding: .55rem .65rem; border: 0; white-space: normal; overflow-wrap: anywhere; }
      tbody th, tbody td:last-child { grid-column: 1 / -1; }
      tbody th { background: #eaf0f7; }
      tbody td:last-child { border-top: 1px solid #e0e7ef; }
      tbody td::before { display: block; font-size: .875rem; font-weight: 600; }
      tbody td:nth-of-type(1)::before { content: "Before" / ""; }
      tbody td:nth-of-type(2)::before { content: "After" / ""; }
      tbody td:nth-of-type(3)::before { content: "Change" / ""; }
    }
  </style>
</head>
<body>
  <main data-revision="$revision">
    <header>
      <p class="eyebrow">Resilient Agent Client</p>
      <h1>Proxy latency</h1>
      <p>Compare request latency for the baseline and candidate proxy configurations.</p>
    </header>
    <div class="toolbar">
      $refresh
      <p class="note" id="refresh-status" role="status" hidden></p>
    </div>
    $context
    $sections
    <p class="note"><a href="https://github.com/lilaclilac09/resilient-agent-client/blob/86d382af98a9f2148723085538ea0c00c4b7f728/docs/BAOLIANDENG.md">BaoLianDeng setup guide for macOS</a> (<a href="https://github.com/lilaclilac09/resilient-agent-client/pull/4">PR #4</a>)</p>
  </main>
  <script>
    for (const comparison of document.querySelectorAll(".comparison")) {
      comparison.addEventListener("focus", () => {
        if (matchMedia("(max-width: 38rem)").matches) {
          requestAnimationFrame(() => comparison.scrollIntoView({block: "start"}));
        }
      });
    }
    document.querySelector("#refresh-results")?.addEventListener("click", (event) => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      location.reload();
    });
    const revision = document.querySelector("main").dataset.revision;
    try {
      const revisionKey = "latency-revision:" + location.pathname;
      const refreshed = document.querySelector("#refresh-results") &&
        performance.getEntriesByType("navigation")[0]?.type === "reload";
      if (refreshed && revision && sessionStorage.getItem(revisionKey) === revision) {
        const status = document.querySelector("#refresh-status");
        const checkedAt = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
        status.textContent = "No change since last refresh (checked " + checkedAt + ").";
        status.hidden = false;
      }
      sessionStorage.setItem(revisionKey, revision);
    } catch (error) {
      if (error.name !== "SecurityError" && error.name !== "QuotaExceededError") throw error;
    }
  </script>
</body>
</html>
